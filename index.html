<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>মোহাম্মদ ফার্মেসী | অনলাইন অর্ডার</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f1f8f5;
  color:#222;
}

header{
  background:linear-gradient(135deg,#075e43,#12b886);
  color:white;
  padding:22px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  width:65px;
  height:65px;
  background:white;
  color:#087f5b;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:34px;
}

header h1{
  font-size:27px;
  margin-top:8px;
}

header p{
  font-size:14px;
}

.cart-button{
  position:absolute;
  right:15px;
  top:20px;
  background:white;
  color:#087f5b;
  border:0;
  padding:10px 14px;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.cart-count{
  background:#e03131;
  color:white;
  padding:3px 7px;
  border-radius:50%;
  font-size:12px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:18px;
}

.search{
  width:100%;
  padding:15px;
  border:2px solid #b2dfd0;
  border-radius:30px;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

.category{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
}

.category button{
  white-space:nowrap;
  border:0;
  background:white;
  color:#087f5b;
  padding:10px 17px;
  border-radius:25px;
  cursor:pointer;
}

.category button.active{
  background:#087f5b;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
}

.product{
  background:white;
  border-radius:17px;
  padding:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.product-icon{
  height:90px;
  background:#e6fcf5;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  margin-bottom:12px;
}

.product h3{
  font-size:17px;
  color:#075e43;
}

.product p{
  font-size:13px;
  color:#666;
  margin:5px 0;
}

.price{
  font-size:18px;
  font-weight:bold;
  color:#e03131;
}

.add{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:25px;
  background:#087f5b;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.section{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.section h2{
  color:#087f5b;
  margin-bottom:15px;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.upload{
  border:2px dashed #087f5b;
  padding:18px;
  border-radius:12px;
  text-align:center;
  background:#f0fff9;
}

.upload input{
  margin-top:10px;
}

.cart-box{
  display:none;
  background:white;
  position:fixed;
  right:0;
  top:0;
  width:100%;
  max-width:420px;
  height:100vh;
  z-index:500;
  padding:20px;
  box-shadow:-5px 0 20px rgba(0,0,0,.2);
  overflow:auto;
}

.cart-box h2{
  color:#087f5b;
  margin-bottom:15px;
}

.close{
  float:right;
  background:#e03131;
  color:white;
  border:0;
  border-radius:50%;
  width:32px;
  height:32px;
  cursor:pointer;
}

.cart-item{
  border-bottom:1px solid #ddd;
  padding:12px 0;
}

.cart-item strong{
  color:#075e43;
}

.qty{
  margin-top:7px;
}

.qty button{
  border:0;
  padding:5px 10px;
  background:#e6fcf5;
  cursor:pointer;
}

.total{
  font-size:20px;
  font-weight:bold;
  color:#e03131;
  margin:15px 0;
}

.order-button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:30px;
  background:#25d366;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.notice{
  background:#fff3bf;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  font-size:14px;
}

footer{
  margin-top:30px;
  background:#064d39;
  color:white;
  text-align:center;
  padding:22px;
}

@media(max-width:500px){
  header h1{
    font-size:23px;
  }

  .cart-button{
    top:15px;
    right:8px;
    padding:8px 10px;
  }

  .products{
    grid-template-columns:1fr 1fr;
  }

  .product{
    padding:11px;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">⚕️</div>

<h1>মোহাম্মদ ফার্মেসী</h1>

<p>রহিমানগর দক্ষিণ বাজার</p>

<button class="cart-button" onclick="openCart()">
🛒 Cart
<span class="cart-count" id="cartCount">0</span>
</button>

</header>


<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="🔍 ওষুধের নাম লিখে খুঁজুন..."
oninput="searchProducts()"
>


<div class="category">

<button class="active" onclick="filterProducts('all',this)">
সব
</button>

<button onclick="filterProducts('medicine',this)">
💊 মেডিসিন
</button>

<button onclick="filterProducts('care',this)">
🧴 স্বাস্থ্যসেবা
</button>

<button onclick="filterProducts('baby',this)">
👶 বেবি কেয়ার
</button>

</div>


<div class="products" id="products"></div>


<div class="section">

<h2>📦 অর্ডারের তথ্য</h2>

<div class="form-group">

<label>আপনার নাম</label>

<input
id="customerName"
type="text"
placeholder="নাম লিখুন"
>

</div>


<div class="form-group">

<label>মোবাইল নম্বর</label>

<input
id="phone"
type="tel"
placeholder="01XXXXXXXXX"
>

</div>


<div class="form-group">

<label>ডেলিভারি ঠিকানা</label>

<textarea
id="address"
placeholder="সম্পূর্ণ ঠিকানা লিখুন"
></textarea>

</div>


<div class="form-group">

<label>📷 প্রেসক্রিপশন</label>

<div class="upload">

<p>
প্রেসক্রিপশন প্রয়োজন হলে ছবি নির্বাচন করুন
</p>

<input
id="prescription"
type="file"
accept="image/*,.pdf"
>

</div>

</div>


<div class="notice">

⚠️ প্রেসক্রিপশন প্রয়োজন এমন ওষুধের ক্ষেত্রে
প্রেসক্রিপশন যাচাই করে অর্ডার নিশ্চিত করা হবে।

</div>

</div>

</div>


<!-- CART -->

<div class="cart-box" id="cartBox">

<button class="close" onclick="closeCart()">×</button>

<h2>🛒 আপনার Cart</h2>

<div id="cartItems"></div>

<div class="total">
মোট: ৳ <span id="total">0</span>
</div>

<button class="order-button" onclick="placeOrder()">
📲 অর্ডার করুন
</button>

</div>


<footer>

<strong>মোহাম্মদ ফার্মেসী</strong><br>
📞 ০১৮৩৫২৪১৯২৯<br>
আপনার সুস্থতা আমাদের অঙ্গীকার ❤️

</footer>


<script>

const products = [

{
id:1,
name:"Napa 500 mg",
description:"Tablet",
price:15,
category:"medicine",
icon:"💊"
},

{
id:2,
name:"Seclo 20 mg",
description:"Capsule",
price:30,
category:"medicine",
icon:"💊"
},

{
id:3,
name:"Fexo 120 mg",
description:"Tablet",
price:35,
category:"medicine",
icon:"💊"
},

{
id:4,
name:"Vitamin C",
description:"Tablet",
price:80,
category:"medicine",
icon:"💊"
},

{
id:5,
name:"Hand Sanitizer",
description:"100 ml",
price:60,
category:"care",
icon:"🧴"
},

{
id:6,
name:"Baby Lotion",
description:"Baby care",
price:180,
category:"baby",
icon:"👶"
},

{
id:7,
name:"ORS",
description:"Oral Saline",
price:5,
category:"medicine",
icon:"💧"
},

{
id:8,
name:"Digital Thermometer",
description:"Medical device",
price:150,
category:"care",
icon:"🌡️"
}

];


let cart=[];


function showProducts(list=products){

const box=document.getElementById("products");

box.innerHTML="";

list.forEach(p=>{

box.innerHTML+=`

<div class="product">

<div class="product-icon">
${p.icon}
</div>

<h3>${p.name}</h3>

<p>${p.description}</p>

<div class="price">
৳ ${p.price}
</div>

<button class="add" onclick="addToCart(${p.id})">
➕ Cart-এ যোগ করুন
</button>

</div>

`;

});

}


function addToCart(id){

const product=products.find(p=>p.id===id);

const existing=cart.find(p=>p.id===id);

if(existing){

existing.qty++;

}else{

cart.push({
...product,
qty:1
});

}

updateCart();

}


function updateCart(){

document.getElementById("cartCount").innerText=
cart.reduce((sum,p)=>sum+p.qty,0);

const box=document.getElementById("cartItems");

box.innerHTML="";

let total=0;

cart.forEach(p=>{

total+=p.price*p.qty;

box.innerHTML+=`

<div class="cart-item">

<strong>${p.name}</strong>

<br>

৳ ${p.price} × ${p.qty}

<div class="qty">

<button onclick="changeQty(${p.id},-1)">−</button>

<button onclick="changeQty(${p.id},1)">+</button>

<button onclick="removeItem(${p.id})">
🗑️
</button>

</div>

</div>

`;

});

document.getElementById("total").innerText=total;

}


function changeQty(id,value){

const item=cart.find(p=>p.id===id);

if(!item)return;

item.qty+=value;

if(item.qty<=0){

cart=cart.filter(p=>p.id!==id);

}

updateCart();

}


function removeItem(id){

cart=cart.filter(p=>p.id!==id);

updateCart();

}


function openCart(){

document.getElementById("cartBox").style.display="block";

}


function closeCart(){

document.getElementById("cartBox").style.display="none";

}


function searchProducts(){

const text=
document.getElementById("search").value.toLowerCase();

const result=products.filter(p=>
p.name.toLowerCase().includes(text)
);

showProducts(result);

}


function filterProducts(category,button){

document.querySelectorAll(".category button")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

if(category==="all"){

showProducts(products);

}else{

showProducts(
products.filter(p=>p.category===category)
);

}

}


function placeOrder(){

if(cart.length===0){

alert("প্রথমে Cart-এ ওষুধ যোগ করুন।");

return;

}


const name=
document.getElementById("customerName").value.trim();

const phone=
document.getElementById("phone").value.trim();

const address=
document.getElementById("address").value.trim();

const prescription=
document.getElementById("prescription").files[0];


if(!name || !phone || !address){

alert("নাম, মোবাইল ও ঠিকানা পূরণ করুন।");

return;

}


let message="🛒 নতুন অর্ডার%0A%0A";

message+="🏪 মোহাম্মদ ফার্মেসী%0A";

message+="👤 নাম: "+name+"%0A";

message+="📞 মোবাইল: "+phone+"%0A";

message+="📍 ঠিকানা: "+address+"%0A%0A";

message+="💊 অর্ডার:%0A";


let total=0;

cart.forEach(p=>{

const subtotal=p.price*p.qty;

total+=subtotal;

message+=
"• "+p.name+
" × "+p.qty+
" = ৳"+subtotal+
"%0A";

});


message+="%0A💰 মোট: ৳"+total+"%0A";


if(prescription){

message+="%0A📷 প্রেসক্রিপশন নির্বাচন করা হয়েছে।";

}


message+="%0A%0Aঅনুগ্রহ করে অর্ডারটি যাচাই করুন।";


const whatsapp=
"https://wa.me/8801835241929?text="+message;

window.open(whatsapp,"_blank");

}


showProducts();

</script>

</body>
</html>
