<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রেসক্রিপশন পাঠান - মোহাম্মদ ফার্মেসী</title>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("_Oe3hEYOfYM2nwF_R"); 
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #00a86b;
            --secondary-color: #004d40;
            --light-bg: #f4fbf7;
            --white: #ffffff;
            --text-color: #333333;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--white);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }

        .upload-container {
            max-width: 600px;
            margin: 40px auto;
            background: var(--white);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .upload-container h1 {
            color: var(--secondary-color);
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .upload-container p {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--secondary-color);
        }

        .success-message {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .whatsapp-divider {
            text-align: center;
            margin: 25px 0 15px 0;
        }

        .whatsapp-btn {
            display: block;
            text-align: center;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
        }

        footer {
            background-color: var(--secondary-color);
            color: var(--white);
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">💊 <b>মোহাম্মদ ফার্মেসী</b></a>
            <ul class="nav-links">
                <li><a href="index.html">হোম</a></li>
                <li><a href="prescription.html" style="color: var(--primary-color); font-weight: bold;">প্রেসক্রিপশন পাঠান</a></li>
            </ul>
        </nav>
    </header>

    <div class="upload-container">
        <h1>প্রেসক্রিপশন পাঠান</h1>
        <p>আপনার তথ্য দিয়ে আমাদের বার্তা পাঠান।</p>

        <div id="successMessage" class="success-message">
            ✅ আপনার তথ্যটি সফলভাবে আমাদের কাছে পৌঁছেছে! আমরা খুব দ্রুত আপনার সাথে যোগাযোগ করব।
        </div>

        <form id="prescriptionForm">
            <div class="form-group">
                <label for="name">আপনার নাম:</label>
                <input type="text" id="name" name="user_name" required placeholder="উদাহরণ: মো: রফিকুল ইসলাম">
            </div>

            <div class="form-group">
                <label for="phone">মোবাইল নম্বর:</label>
                <input type="tel" id="phone" name="user_phone" required placeholder="018XXXXXXXX">
            </div>

            <div class="form-group">
                <label for="address">ঠিকানা বা ঔষধের বিবরণ:</label>
                <textarea id="address" name="message" rows="3" placeholder="আপনার প্রয়োজনীয় ঔষধ বা ঠিকানা লিখুন"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">মেসেজ পাঠান</button>
        </form>

        <div class="whatsapp-divider">
            <span>অথবা</span>
        </div>

        <a href="https://wa.me/8801835241929?text=আমি%20একটি%20প্রেসক্রিপশন%20পাঠাতে%20চাই" target="_blank" class="whatsapp-btn">
            📱 হোয়াটসঅ্যাপের মাধ্যমে প্রেসক্রিপশন বা ছবি পাঠান
        </a>
    </div>

    <footer>
        <p>&copy; ২০২৬ মোহাম্মদ ফার্মেসী। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        const form = document.getElementById('prescriptionForm');
        const successMsg = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.innerText = 'পাঠানো হচ্ছে...';
            submitBtn.disabled = true;

            // নতুন সার্ভিস আইডি সঠিকভাবে বসানো হয়েছে
            emailjs.sendForm('service_rwu2frp', 'template_qumfdbq', this)
                .then(function() {
                    form.style.display = 'none';
                    successMsg.style.display = 'block';
                }, function(error) {
                    alert('দুঃখিত, তথ্য পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
                    submitBtn.innerText = 'মেসেজ পাঠান';
                    submitBtn.disabled = false;
                });
        });
    </script>

</body>
</html>
