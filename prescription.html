<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>প্রেসক্রিপশন | মোহাম্মদ ফার্মেসী</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#eefaf6;
color:#222;
}

.header{
background:linear-gradient(135deg,#075e43,#12b886);
color:white;
text-align:center;
padding:25px 15px;
}

.header h1{
font-size:28px;
}

.header p{
margin-top:5px;
}

.container{
max-width:850px;
margin:auto;
padding:20px;
}

.paper{
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 7px 25px rgba(0,0,0,.1);
}

.shop{
text-align:center;
border-bottom:2px solid #087f5b;
padding-bottom:15px;
margin-bottom:20px;
}

.shop h2{
color:#087f5b;
font-size:27px;
}

.shop p{
margin-top:5px;
}

.title{
text-align:center;
color:#5f3dc4;
margin:20px 0;
font-size:24px;
}

.info{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.field{
margin-bottom:10px;
}

.field label{
display:block;
font-weight:bold;
margin-bottom:5px;
color:#087f5b;
}

.field input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#e6fcf5;
color:#087f5b;
}

td input{
width:100%;
border:0;
outline:none;
padding:8px;
font-size:15px;
}

.btn-area{
text-align:center;
margin-top:25px;
}

button{
border:none;
padding:13px 22px;
border-radius:30px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:5px;
}

.print{
background:#087f5b;
color:white;
}

.back{
background:#5f3dc4;
color:white;
}

.note{
margin-top:25px;
padding:15px;
background:#fff3bf;
border-radius:10px;
text-align:center;
}

footer{
text-align:center;
padding:20px;
margin-top:25px;
background:#064d39;
color:white;
}

@media(max-width:600px){

.info{
grid-template-columns:1fr;
}

.paper{
padding:15px;
}

table{
font-size:13px;
}

th,td{
padding:6px;
}

}

@media print{

body{
background:white;
}

.btn-area,
footer{
display:none;
}

.paper{
box-shadow:none;
}

}

</style>

</head>

<body>

<div class="header">

</div>


<div class="btn-area">

<button class="print" onclick="window.print()">

</button>

<button class="back"

</button>

</div>

</div>

</div>


<footer>

© ২০২৬ মোহাম্মদ ফার্মেসী

</footer>

</body>
</html>
